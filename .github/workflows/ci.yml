name: CI - Build, Test & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore ElectronicHealthRecord.slnx

      - name: Compilar a solução
        run: dotnet build ElectronicHealthRecord.slnx --configuration Release --no-restore

      - name: Executar testes automatizados
        run: dotnet test ElectronicHealthRecord.slnx --configuration Release --no-build --verbosity normal

      - name: Validar build da imagem Docker
        run: docker build -t prontuario-api:ci -f Dockerfile .
